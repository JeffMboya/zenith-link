app = "zenith-link"
primary_region = "jnb"

[build]
  dockerfile = "docker/Dockerfile.fly"

[env]
  GROUNDSTATION_ADDR = ":8080"
  SC_ADDR            = "http://localhost:8090"
  RELAY1_ADDR        = "http://localhost:8082"
  RELAY2_ADDR        = "http://localhost:8083"
  RELAY_ADDR         = ":8082"
  RELAY2_ADDR_BIND   = ":8083"
  SC1_ADDR           = "http://localhost:8090"
  RELAY1_PEER_ADDR   = "http://localhost:8082"
  GS_ADDR            = "http://localhost:8080"
  SPACECRAFT_ADDR    = ":8090"
  SPACECRAFT_SCID    = "90"
  SPACECRAFT_VCID    = "0"
  SPACECRAFT_APID    = "256"
  RELAY_SCID         = "91"
  RELAY2_SCID        = "92"
  GS_LAT             = "-1.2864"
  GS_LON             = "36.8172"
  MIN_ELEV_DEG       = "5.0"
  POLL_INTERVAL_SEC  = "30"
  STATIC_DIR         = "/app/dist"

[[services]]
  internal_port = 8080
  protocol      = "tcp"

  [[services.ports]]
    port     = 80
    handlers = ["http"]

  [[services.ports]]
    port     = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  size = "shared-cpu-2x"
