version: "3.9"

x-common: &common
  restart: unless-stopped
  environment:
    - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY:?ORBITRON_HMAC_KEY must be set}

x-relay: &relay
  restart: unless-stopped
  build:
    context: ..
    dockerfile: docker/Dockerfile.relay
  environment:
    - RELAY_ADDR=:8082
    - SC1_ADDR=http://spacecraft1:8080
    - SC2_ADDR=http://spacecraft2:8080
    - SC3_ADDR=http://spacecraft3:8080
    - GS_ADDR=http://groundstation:8081
    - GS2_ADDR=http://gs2:8085
    - GS2_LAT=78.2232
    - GS2_LON=15.6267
    - GS3_ADDR=http://gs3:8086
    - GS3_LAT=-53.1638
    - GS3_LON=-70.9171
    - GS_LAT=-1.2864
    - GS_LON=36.8172
    - MIN_ELEV_DEG=5.0
    - CLOUD_COVER_THRESHOLD=0.65
    - MAX_BUNDLE_DEPTH=100
    - POLL_INTERVAL_SEC=30
    - LINK_LOSS_RATE=${LINK_LOSS_RATE:-0.05}
  depends_on:
    - spacecraft1
    - spacecraft2
    - spacecraft3
    - groundstation
    - gs2
    - gs3

services:
  spacecraft1:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.spacecraft
    ports:
      - "8080:8080"
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY}
      - SPACECRAFT_ADDR=:8080
      - SPACECRAFT_SCID=90
      - SPACECRAFT_VCID=0
      - SPACECRAFT_APID=256
      - SPACECRAFT_NAME=ISS
      - ISL_SOURCE_TAG=sc1
      - ISL_PEER1_ADDR=http://spacecraft2:8080
      - ISL_PEER2_ADDR=http://spacecraft3:8080

  spacecraft2:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.spacecraft
    ports:
      - "8087:8080"
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY}
      - SPACECRAFT_ADDR=:8080
      - SPACECRAFT_SCID=91
      - SPACECRAFT_VCID=0
      - SPACECRAFT_APID=257
      - SPACECRAFT_NAME=Tiangong
      - ISL_SOURCE_TAG=sc2
      - ISL_PEER1_ADDR=http://spacecraft1:8080
      - ISL_PEER2_ADDR=http://spacecraft3:8080

  spacecraft3:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.spacecraft
    ports:
      - "8094:8080"
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY}
      - SPACECRAFT_ADDR=:8080
      - SPACECRAFT_SCID=98
      - SPACECRAFT_VCID=0
      - SPACECRAFT_APID=258
      - SPACECRAFT_NAME=HST
      - ISL_SOURCE_TAG=sc3
      - ISL_PEER1_ADDR=http://spacecraft1:8080
      - ISL_PEER2_ADDR=http://spacecraft2:8080

  groundstation:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.groundstation
    ports:
      - "8081:8081"
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY}
      - GROUNDSTATION_ADDR=:8081
      - GS_MAX_SUBSCRIBERS=64
      - GS_LAT=-1.2864
      - GS_LON=36.8172
      - SC_ADDR=http://spacecraft1:8080
      - SC2_ADDR=http://spacecraft2:8080
      - SC3_ADDR=http://spacecraft3:8080
      - SC_SCID=90
      - SC_VCID=0
      - RELAY1_ADDR=http://relay-noaa20:8082
      - RELAY2_ADDR=http://relay-sentinel2a:8082
      - RELAY3_ADDR=http://relay-landsat9:8082
      - RELAY4_ADDR=http://relay-aqua:8082
      - RELAY5_ADDR=http://relay-terra:8082
      - RELAY6_ADDR=http://relay-noaa19:8082
    depends_on:
      - spacecraft1
      - spacecraft2
      - spacecraft3

  gs2:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.groundstation
    ports:
      - "8085:8085"
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY}
      - GROUNDSTATION_ADDR=:8085
      - GS_MAX_SUBSCRIBERS=64
      - GS_LAT=78.2232
      - GS_LON=15.6267
      - SC_ADDR=http://spacecraft1:8080
      - SC_SCID=90
      - SC_VCID=0
    depends_on:
      - spacecraft1

  gs3:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.groundstation
    ports:
