version: "3.9"

# Production compose for DigitalOcean Droplet.
# Only nginx (ports 80/443) is exposed publicly. Set ORBITRON_HMAC_KEY in .env.
#
# Quick start:
#   cp .env.example .env && nano .env
#   docker compose -f docker/docker-compose.prod.yaml up -d --build

x-common: &common
  restart: unless-stopped

x-relay: &relay
  restart: unless-stopped
  build:
    context: ..
    dockerfile: docker/Dockerfile.relay
  environment:
    - RELAY_ADDR=:8082
    - SC1_ADDR=http://spacecraft1:8080
    - SC2_ADDR=http://spacecraft2:8080
    - GS_ADDR=http://groundstation:8081
    - GS2_ADDR=http://gs2:8085
    - GS2_LAT=78.2232
    - GS2_LON=15.6267
    - GS3_ADDR=http://gs3:8086
    - GS3_LAT=-53.1638
    - GS3_LON=-70.9171
    - GS_LAT=-1.2864
    - GS_LON=36.8172
    - MIN_ELEV_DEG=5.0
    - POLL_INTERVAL_SEC=30
    - LINK_LOSS_RATE=${LINK_LOSS_RATE:-0.05}
  depends_on:
    - spacecraft1
    - spacecraft2
    - groundstation
    - gs2
    - gs3

services:
  frontend:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - groundstation
      - gs2
      - gs3
      - gs4
      - gs5
      - gs6
      - spacecraft1
      - spacecraft2
      - relay-noaa20
      - relay-sentinel2a
      - relay-landsat9
      - relay-aqua
      - relay-terra
      - relay-noaa19

  spacecraft1:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.spacecraft
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY:?ORBITRON_HMAC_KEY must be set in .env}
      - SPACECRAFT_ADDR=:8080
      - SPACECRAFT_SCID=90
      - SPACECRAFT_VCID=0
      - SPACECRAFT_APID=256

  spacecraft2:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.spacecraft
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY:?ORBITRON_HMAC_KEY must be set in .env}
      - SPACECRAFT_ADDR=:8080
      - SPACECRAFT_SCID=91
      - SPACECRAFT_VCID=0
      - SPACECRAFT_APID=257

  groundstation:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.groundstation
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY:?ORBITRON_HMAC_KEY must be set in .env}
      - GROUNDSTATION_ADDR=:8081
      - GS_MAX_SUBSCRIBERS=64
      - GS_LAT=-1.2864
      - GS_LON=36.8172
      - SC_ADDR=http://spacecraft1:8080
      - SC2_ADDR=http://spacecraft2:8080
      - SC_SCID=90
      - SC_VCID=0
      - RELAY1_ADDR=http://relay-noaa20:8082
      - RELAY2_ADDR=http://relay-sentinel2a:8082
      - RELAY3_ADDR=http://relay-landsat9:8082
      - RELAY4_ADDR=http://relay-aqua:8082
      - RELAY5_ADDR=http://relay-terra:8082
      - RELAY6_ADDR=http://relay-noaa19:8082
      - GS4_ADDR=http://gs4:8087
      - GS5_ADDR=http://gs5:8088
      - GS6_ADDR=http://gs6:8089
    depends_on:
      - spacecraft1
      - spacecraft2

  gs2:
    <<: *common
    build:
      context: ..
      dockerfile: docker/Dockerfile.groundstation
    environment:
      - ORBITRON_HMAC_KEY=${ORBITRON_HMAC_KEY:?ORBITRON_HMAC_KEY must be set in .env}
      - GROUNDSTATION_ADDR=:8085
      - GS_MAX_SUBSCRIBERS=64
      - GS_LAT=78.2232
      - GS_LON=15.6267
      - SC_ADDR=http://spacecraft1:8080
      - SC_SCID=90
      - SC_VCID=0
    depends_on:
      - spacecraft1

  gs3:
