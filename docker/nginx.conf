upstream groundstation   { server groundstation:8081; }
upstream spacecraft1     { server spacecraft1:8080;  }
upstream spacecraft2     { server spacecraft2:8080;  }
upstream spacecraft3     { server spacecraft3:8080;  }
upstream relay-noaa20    { server relay-noaa20:8082; }
upstream relay-sentinel2a { server relay-sentinel2a:8082; }
upstream relay-landsat9  { server relay-landsat9:8082; }
upstream relay-aqua      { server relay-aqua:8082;   }
upstream relay-terra     { server relay-terra:8082;  }
upstream relay-noaa19    { server relay-noaa19:8082; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name orbitron-dev.ddns.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name orbitron-dev.ddns.net;

    ssl_certificate     /etc/letsencrypt/live/orbitron-dev.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orbitron-dev.ddns.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    # WebSocket — groundstation (ISS / spacecraft-1)
    location = /ws {
        proxy_pass         http://groundstation/ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # WebSocket — Tiangong (spacecraft-2), filtered by scid at groundstation
    location = /spacecraft2/ws {
        proxy_pass         http://groundstation/ws?scid=sc2;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # WebSocket — Hubble (spacecraft-3), filtered by scid at groundstation
    location = /spacecraft3/ws {
        proxy_pass         http://groundstation/ws?scid=sc3;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # AI health proxy — spacecraft-1
    location = /query-health-ai {
        proxy_pass         http://spacecraft1/query-health-ai;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    # Ground station API
    location ~ ^/(health|latest|receive|metrics|command|capabilities|topology) {
        proxy_pass http://groundstation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Spacecraft-1 API (primary)
    location ~ ^/(windows|state|track|constellation|tle|events|payload|inference) {
        proxy_pass http://spacecraft1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Spacecraft-2 API (Tiangong)
    location /spacecraft2/ {
        rewrite    ^/spacecraft2/(.*)$ /$1 break;
        proxy_pass http://spacecraft2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Spacecraft-3 API (Hubble)
    location /spacecraft3/ {
        rewrite    ^/spacecraft3/(.*)$ /$1 break;
        proxy_pass http://spacecraft3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ISL Relay nodes
    location /relay1/ {
        rewrite    ^/relay1/(.*)$ /$1 break;
        proxy_pass http://relay-noaa20;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /relay2/ {
        rewrite    ^/relay2/(.*)$ /$1 break;
        proxy_pass http://relay-sentinel2a;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /relay3/ {
        rewrite    ^/relay3/(.*)$ /$1 break;
        proxy_pass http://relay-landsat9;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /relay4/ {
        rewrite    ^/relay4/(.*)$ /$1 break;
        proxy_pass http://relay-aqua;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /relay5/ {
        rewrite    ^/relay5/(.*)$ /$1 break;
        proxy_pass http://relay-terra;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /relay6/ {
        rewrite    ^/relay6/(.*)$ /$1 break;
        proxy_pass http://relay-noaa19;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend SPA
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
