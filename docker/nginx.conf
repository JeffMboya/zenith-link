upstream groundstation { server groundstation:8081; }
upstream spacecraft    { server spacecraft:8080;    }
upstream relay1        { server relay:8082;         }
upstream relay2        { server relay2:8083;        }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Increase buffer for WebSocket
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # WebSocket — groundstation
    location /ws {
        proxy_pass         http://groundstation;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Ground station API
    location ~ ^/(health|latest|receive|metrics|command) {
        proxy_pass http://groundstation;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Spacecraft API (windows, state, track, constellation, tle, events, payload, inference)
    location ~ ^/(windows|state|track|constellation|tle|events|payload|inference) {
        proxy_pass http://spacecraft;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ISL Relay-1 — strip /relay prefix
    location /relay/ {
        rewrite    ^/relay/(.*)$ /$1 break;
        proxy_pass http://relay1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ISL Relay-2 — strip /relay2 prefix
    location /relay2/ {
        rewrite    ^/relay2/(.*)$ /$1 break;
        proxy_pass http://relay2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend — SPA catch-all
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
